# Proyecto de Xcode de la app iOS. No se sube el .xcodeproj: se genera con
# XcodeGen (`brew install xcodegen`, y en esta carpeta `xcodegen generate`).
# Mismo modelo que OpoAlert: se compila en GitHub Actions, no en el iMac.
name: Radares
options:
  bundleIdPrefix: es.mjtbapps
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: es
packages:
  RadaresCore:
    path: RadaresCore
  # Anuncio al abrir (AdMob); trae también el formulario de consentimiento (UMP).
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 12.0.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    majorVersion: 3.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Radares:
    type: application
    platform: iOS
    sources:
      - path: Radares
        excludes:
          - "Voces/**"
      - path: Compartido
      # Audios de las voces naturales (scripts/generar_voces.py), como carpeta para
      # conservar Voces/<voz>/<pieza>.mp3.
      - path: Radares/Voces
        type: folder
        buildPhase: resources
    dependencies:
      - package: RadaresCore
      - package: GoogleMobileAds
      - package: UserMessagingPlatform
      - target: Aviso
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.mjtbapps.radares
        PRODUCT_NAME: Radares
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chivato
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Radares/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        # location: seguir recibiendo el GPS con la pantalla apagada.
        # audio: poder hablar con la app en segundo plano.
        UIBackgroundModes: [location, audio]
        # Tarjeta con el próximo radar en la pantalla de bloqueo (extensión Aviso).
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # AdMob: identificador de la app (de prueba hasta tener el real) y redes publicitarias.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        NSLocationWhenInUseUsageDescription: "Chivato Radar usa tu posición para avisarte de los radares que tienes delante. No sale del iPhone."
        # Solo si se activa «Empezar sola al ir en coche».
        NSLocationAlwaysAndWhenInUseUsageDescription: "Con «Siempre», Chivato Radar se pone a vigilar sola cuando detecta que vas en coche, sin que abras la app. Tu posición no sale del iPhone."
        NSMotionUsageDescription: "Chivato Radar usa el sensor de movimiento para saber si vas en coche y ponerse a vigilar sola, sin gastar GPS. Solo si activas «Empezar sola al ir en coche»."
        # La app no graba nada. iOS exige este texto porque el aviso por el canal de
        # llamadas del coche y por el altavoz usa una sesión de audio de «reproducir y grabar».
        NSMicrophoneUsageDescription: "Chivato Radar no graba ni escucha nada. iOS pide este permiso para poder dar el aviso por el canal de llamadas del coche."
  Aviso:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: Aviso
      - path: Compartido
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.mjtbapps.radares.Aviso
        PRODUCT_NAME: Aviso
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chivato
        SKIP_INSTALL: YES
    info:
      path: Aviso/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Radares:
    build:
      targets:
        Radares: all
