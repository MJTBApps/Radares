name: Chivato - Imagenes para Google Play

# Abre la app en un emulador de Android, saca capturas de pantalla y prepara el icono
# (512x512) y el grafico destacado (1024x500) para la ficha de Google Play.
# Se lanza a mano; todo queda como artefacto «chivato-google-play-imagenes».
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compilar la APK de depuracion
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Permitir KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capturas en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p salida
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant es.mjtbapps.radares android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant es.mjtbapps.radares android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant es.mjtbapps.radares android.permission.POST_NOTIFICATIONS
            adb shell 'run-as es.mjtbapps.radares sh -c "mkdir -p shared_prefs; echo \"<?xml version=\\\"1.0\\\" encoding=\\\"utf-8\\\" standalone=\\\"yes\\\" ?><map><boolean name=\\\"premium\\\" value=\\\"true\\\" /></map>\" > shared_prefs/ajustes.xml"'
            adb shell settings put system time_12_24 24
            adb shell cmd uimode night no
            adb emu geo fix -3.6200 40.4600
            adb shell am start -n es.mjtbapps.radares/.Principal
            sleep 12
            adb exec-out screencap -p > salida/captura-1.png
            adb shell input swipe 540 1800 540 700 600
            sleep 3
            adb exec-out screencap -p > salida/captura-2.png
            adb shell input swipe 540 1800 540 600 600
            sleep 3
            adb exec-out screencap -p > salida/captura-3.png
            adb shell cmd uimode night yes
            sleep 3
            adb shell am force-stop es.mjtbapps.radares
            adb shell am start -n es.mjtbapps.radares/.Principal
            sleep 10
            adb exec-out screencap -p > salida/captura-4-oscuro.png

      - name: Icono y grafico destacado
        run: |
          pip install pillow
          python3 scripts/imagenes_play.py ios/Radares/Assets.xcassets/AppIcon.appiconset/icono.png salida

      - uses: actions/upload-artifact@v4
        with:
          name: chivato-google-play-imagenes
          path: salida/*.png
